services:
  # Non-GUI test runner (Works 100% identically on Windows, macOS, Linux)
  tests:
    build: .
    command: python -m unittest discover -s tests_unit

  # Deterministic non-GUI tests (Works 100% identically on Windows, macOS, Linux)
  tests-deterministic:
    build: .
    command: python -m unittest discover -s tests_deterministic